name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release from tag message
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          BODY="$(git tag -l --format='%(contents)' "$TAG")"
          if [ -z "$BODY" ]; then
            echo "Tag $TAG has no message (lightweight tag?). Use an annotated tag." >&2
            exit 1
          fi
          gh release create "$TAG" --title "${TAG#v}" --notes "$BODY"
